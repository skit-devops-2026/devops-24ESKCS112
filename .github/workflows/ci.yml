name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — YOUR WORK STARTS HERE. (Aapka MT1 ka chal raha test job)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
  
      # Agar aapke root me Makefile hai toh ye targets chalenge
      - run: make install
      - run: make test
      - run: make build

  # ---------------------------------------------------------------------------
  # M4 — Containerization (Milestone 5)
  # ---------------------------------------------------------------------------
  docker:
    name: Build and push images
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t travel-x ./frontend

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag for GHCR
        run: docker tag travel-x ghcr.io/skit-devops-2026/devops-24eskcs112:latest

      - name: Push to GHCR
        run: docker push ghcr.io/skit-devops-2026/devops-24eskcs112:latest

  # ---------------------------------------------------------------------------
  # M5 — Deployment. Add a deploy job here.
  # ---------------------------------------------------------------------------
