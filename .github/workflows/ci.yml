name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — YOUR WORK STARTS HERE. (Aapka MT1 ka chal raha test job)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
  
      # Agar aapke root me Makefile hai toh ye targets chalenge
      - run: make install
      - run: make test
      - run: make build
  # ---------------------------------------------------------------------------
  # M4 — Containerization.
  # ---------------------------------------------------------------------------
  docker:
    name: Build and push images
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          # Yahan aapka username poora lowercase (dineshgehlot2005) kar diya hai
          tags: ghcr.io/dineshgehlot2005/travel-x:latest


  # ---------------------------------------------------------------------------
  # M5 — Deployment. Add a deploy job here.
  # ---------------------------------------------------------------------------
